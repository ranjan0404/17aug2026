name: Terraform CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Scan Plan Apply
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # 3. Terraform Version
      - name: Terraform Version
        run: terraform version

      # 4. Azure Login using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Azure Account
      - name: Azure Account
        run: az account show

      # 6. Set Terraform Service Principal Authentication
      - name: Set Terraform Authentication
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_ENV
          echo "ARM_USE_CLI=false" >> $GITHUB_ENV

      # 7. Setup TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # 8. TFLint
      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # 9. tfsec
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          soft_fail: false

      # 10. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 11. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 12. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 13. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
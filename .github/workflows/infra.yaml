
name: Terraform CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Security Scan and Plan
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 1. Checkout Repository
      # -----------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------
      # 2. Setup Terraform
      # -----------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # -----------------------------------
      # 3. Terraform Version
      # -----------------------------------
      - name: Terraform Version
        run: terraform version

    
      # -----------------------------------
      # 5. TFLint
      # -----------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # -----------------------------------
      # 6. tfsec Security Scan
      # -----------------------------------
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          soft_fail: false

      # -----------------------------------
      # 7. Terraform Init
      # -----------------------------------
      - name: Terraform Init
        run: terraform init

      # -----------------------------------
      # 8. Terraform Validate
      # -----------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -----------------------------------
      # 9. Terraform Plan
      # -----------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -out=tfplan

      # -----------------------------------
      # 10. Convert Plan to JSON
      # -----------------------------------
      - name: Terraform Show
        run: |
          terraform show \
            -json tfplan > tfplan.json

      # -----------------------------------
      # 11. azure log in
      # -----------------------------------
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}

      # -----------------------------------
      # 11. terraform apply
      # -----------------------------------
      - name : terraform apply
        run: terraform apply -auto-approve

```
